# Publishes the dashboard to GitHub Pages and refreshes the reading every 15 minutes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: We Beefin Index

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Take a reading
        run: node collect.mjs
        env:
          # Carries the 7-day trend over from the copy that is already live.
          PREV_URL: ${{ steps.pages.outputs.base_url }}/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
