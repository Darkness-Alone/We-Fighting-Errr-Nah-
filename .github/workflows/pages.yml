# Publishes the dashboard to GitHub Pages and takes a fresh reading four times an hour.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: We Beefin Index

on:
  push:
    branches: [main]
  schedule:
    # Deliberately off the quarter-hours. GitHub delays or drops scheduled runs at busy
    # minutes like :00 and :15, and "every 15 minutes" was firing only a few times a day.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Explain a Pages failure
        if: failure() && steps.pages.outcome == 'failure'
        run: echo "::error::GitHub Pages is not set to deploy from Actions. Open Settings > Pages and set Source to GitHub Actions."
      - name: Take a reading
        run: node collect.mjs
        env:
          # The live copy holds the collector's memory (24h of event data, the 7-day trend, the last index).
          PREV_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes can't see an artifact for a few seconds after it uploads, and the deploy fails with
      # "No artifacts named github-pages were found". Wait and try once more before calling the run a failure.
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
