# Runs the tests and one dry reading on every branch push and pull request, without publishing.
# The reading's log lists each source as ok or FAIL, which is how new feeds get verified before a merge.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Dry reading
        run: node collect.mjs
      - name: Probe candidate sources (temporary)
        run: node scripts/probe.mjs
